[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "action-chunk-graph"
version = "0.1.0"
description = "Toy SE(2)/SE(3) graph optimization for action-chunk reconciliation"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "pandas>=2.1",
]

[tool.setuptools.packages.find]
where = ["src"]
